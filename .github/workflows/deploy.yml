name: Deploy MPLADS to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mplads-ec2-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy on EC2
    runs-on: [self-hosted, app]
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Restart application
        shell: bash
        run: |
          set -euo pipefail

          stop_process() {
            local pid_file="$1"
            if [ -f "$pid_file" ]; then
              pid="$(cat "$pid_file")"
              if kill -0 "$pid" 2>/dev/null; then
                kill "$pid" || true
                for _ in {1..20}; do
                  kill -0 "$pid" 2>/dev/null || break
                  sleep 1
                done
              fi
              rm -f "$pid_file"
            fi
          }

          stop_process .app.pid
          fuser -k 3000/tcp 2>/dev/null || true

          : > app.log

          nohup env NODE_ENV=production RUNNER_TRACKING_ID= npm start \
            > app.log 2>&1 < /dev/null &
          echo $! > .app.pid

          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/; then
              break
            fi
            if ! kill -0 "$(cat .app.pid)" 2>/dev/null; then
              echo 'Application exited before becoming healthy. app.log:' >&2
              cat app.log >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null || {
            echo 'Application did not become healthy within 30 seconds. app.log:' >&2
            cat app.log >&2
            exit 1
          }
